<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>写真を追加</title><header><small>PRIVATE PHOTO SLIDE</small><h1>スマホから写真を追加</h1><a href="index.html">再生画面へ</a></header><main><p>選択 → スマホ内でJPEG化・縮小 → 暗号化 → GitHubへ送信</p><p>初期サンプルに追加する場合はデモ用パスワードを使用。実写真はサンプルを除き、新しい強いパスワードで始めてください。</p><form id="form"><label>GitHubユーザー名<input id="owner" required pattern="[A-Za-z0-9-]+"></label><label>リポジトリ名<input id="repo" required pattern="[A-Za-z0-9_.-]+"></label><label>ブランチ<input id="branch" value="main" required></label><label>GitHub Fine-grained PAT<input id="token" type="password" required autocomplete="off"></label><small>対象リポジトリだけに Contents: Read and write。トークンは保存しません。</small><label>アルバムのパスワード（12文字以上）<input id="password" type="password" minlength="12" required autocomplete="off"></label><label>写真（複数選択可）<input id="files" type="file" accept="image/*" multiple required></label><button id="send" type="submit">暗号化してアップロード</button></form><progress id="progress" value="0" max="1"></progress><pre id="status" role="status" aria-live="polite"></pre><p>完了までページを開いてください。失敗した写真は選び直して再送できます。公開反映には時間がかかります。</p></main><script type="module" src="upload.js?v=3"></script></html>
